[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "mosaicparse"
version = "0.3.0"
description = "Self-hosted multimodal content evidence parser for external RAG systems"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "MosaicParse contributors" }]
keywords = ["multimodal", "rag", "docling", "ocr", "pdf", "video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "aiofiles==25.1.0",
  "aiosqlite==0.22.1",
  "docling==2.119.0",
  "docling-glm-ocr==0.5.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "orjson==3.11.9",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pymupdf==1.28.2",
  "python-multipart==0.0.32",
  "sse-starlette==3.4.8",
  "tenacity==9.1.4",
  # Force CPU wheels in the parser image. GLM-OCR inference runs in its own GPU service.
  "torch==2.13.0+cpu",
  "torchvision==0.28.0+cpu",
  "uvicorn[standard]==0.52.1",
]

[project.urls]
Documentation = "https://github.com/Scisaga/mosaic-parse#readme"
Issues = "https://github.com/Scisaga/mosaic-parse/issues"
Repository = "https://github.com/Scisaga/mosaic-parse"

[dependency-groups]
dev = [
  "cairosvg==2.8.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "gpu: requires a real GPU model backend and is excluded from CI",
  "integration: exercises multiple application components",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
