name: Remove retired GHCR package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  remove:
    name: Delete docling-glm-parser package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the retired container package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/docling-glm-parser")
          if [ "$status" = "204" ]; then
            echo "Retired package deleted."
            exit 0
          fi
          if [ "$status" = "404" ]; then
            echo "Retired package is already absent."
            exit 0
          fi
          echo "Package deletion failed with HTTP ${status}." >&2
          exit 1
